<div class="p-6 space-y-4">
  <h1 class="text-2xl font-bold">Goods Receipt Form</h1>

  <form (ngSubmit)="submitForm()" class="space-y-4">
    <div>
      <label class="block font-semibold">Product</label>
      <select
        [(ngModel)]="productId"
        name="productId"
        class="border px-2 py-1 w-full"
        required
        title="Select a product"
      >
        <option value="" disabled selected>Select a product</option>
        <option *ngFor="let product of products" [value]="product.id">
          {{ product.name }} ({{ product.id }})
        </option>
      </select>
    </div>

    <div>
      <label class="block font-semibold">Quantity Received</label>
      <input
        type="number"
        [(ngModel)]="quantity"
        name="quantity"
        class="border px-2 py-1 w-full"
        required
        placeholder="Enter quantity"
        title="Quantity"
      />
    </div>

    <div>
      <label class="block font-semibold">Location</label>
      <select
        [(ngModel)]="locationId"
        name="locationId"
        class="border px-2 py-1 w-full"
        required
        title="Select a location"
      >
        <option value="" disabled selected>Select a location</option>
        <option *ngFor="let location of locations" [value]="location.id">
          {{ location.name }} ({{ location.id }})
        </option>
      </select>
    </div>

    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Receive Goods</button>
  </form>
</div>

<!-- Summary Table of Received Goods -->
<div class="mt-8">
  <h2 class="text-xl font-semibold mb-2">Received Goods Summary</h2>

  <div class="mb-3 flex flex-wrap gap-3 items-center">
    <input
      type="text"
      [(ngModel)]="summaryFilterText"
      (ngModelChange)="applySummaryFilters()"
      placeholder="Search by product, location, qty, or time"
      class="border px-3 py-2 w-full max-w-md"
    />
    <label class="text-sm">Sort by:</label>
    <select class="border px-2 py-1" [ngModel]="summarySortField" (ngModelChange)="onSummarySortFieldChange($event)">
      <option [ngValue]="''">None</option>
      <option [ngValue]="'productId'">Product ID</option>
      <option [ngValue]="'quantity'">Quantity</option>
      <option [ngValue]="'locationId'">Location</option>
      <option [ngValue]="'timestamp'">Timestamp</option>
    </select>
    <select class="border px-2 py-1" [ngModel]="summarySortDirection" (ngModelChange)="onSummarySortDirectionChange($event)">
      <option [ngValue]="'asc'">Ascending</option>
      <option [ngValue]="'desc'">Descending</option>
    </select>

    <button type="button" (click)="clearSummaryFilters()" class="border px-3 py-2 rounded bg-gray-100 hover:bg-gray-200">
      Clear
    </button>
  </div>

  <table class="table-auto w-full border border-collapse">
    <thead>
      <tr>
        <th class="px-4 py-2 cursor-pointer" (click)="sortSummary('productId')">Product ID</th>
        <th class="px-4 py-2 cursor-pointer" (click)="sortSummary('quantity')">Quantity</th>
        <th class="px-4 py-2 cursor-pointer" (click)="sortSummary('locationId')">Location</th>
        <th class="px-4 py-2 cursor-pointer" (click)="sortSummary('timestamp')">Timestamp</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of filteredSummary" class="hover:bg-gray-50">
        <td class="border px-4 py-2">{{ item.productId }}</td>
        <td class="border px-4 py-2">{{ item.quantity }}</td>
        <td class="border px-4 py-2">{{ item.locationId }}</td>
        <td class="border px-4 py-2">{{ item.timestamp | date : 'medium' }}</td>
      </tr>
    </tbody>
  </table>

  @if (filteredSummary.length === 0) {
  <p class="text-gray-500 mt-2">No goods have been received yet.</p>
  }
</div>
