<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Stock Received Log</h1>
  <div class="mb-4">
    <input
      type="text"
      [(ngModel)]="filterText"
      (ngModelChange)="applyFilters()"
      placeholder="Filter by product, location, qty, or time"
      class="border px-3 py-2 w-full max-w-md"
    />
  </div>

  <table class="table-auto w-full border border-collapse">
    <thead>
      <tr>
        <th class="px-4 py-2 text-left cursor-pointer" (click)="sort('productId')">Product ID</th>
        <th class="px-4 py-2 text-left cursor-pointer" (click)="sort('qty')">Quantity</th>
        <th class="px-4 py-2 text-left cursor-pointer" (click)="sort('toLocationId')">Location</th>
        <th class="px-4 py-2 text-left cursor-pointer" (click)="sort('timestamp')">Timestamp</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let entry of sortedItems" class="hover:bg-gray-50">
        <td class="border px-4 py-2">{{ entry.productId }}</td>
        <td class="border px-4 py-2">{{ entry.qty }}</td>
        <td class="border px-4 py-2">{{ entry.toLocationId }}</td>
        <td class="border px-4 py-2">{{ entry.timestamp | date : 'medium' }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="sortedItems.length === 0" class="text-gray-500 mt-4">
    No stock has been received yet.
  </p>
</div>
