<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Stock Received Log</h1>
  <div class="mb-4 flex items-center gap-3">
    <input pInputText type="text" [(ngModel)]="filterText" (input)="dt.filterGlobal(filterText, 'contains')" placeholder="Search..." class="w-full max-w-md" />
    <button type="button" (click)="clearFilters(); dt.clear()" class="border px-3 py-2 rounded bg-gray-100 hover:bg-gray-200">Clear</button>
  </div>

  <p-table #dt [value]="receivedItems" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10,20,50]" [sortMode]="'multiple'" [resizableColumns]="true" [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first} to {last} of {totalRecords}">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="productId">Product ID <p-sortIcon field="productId"></p-sortIcon></th>
        <th pSortableColumn="qty">Quantity <p-sortIcon field="qty"></p-sortIcon></th>
        <th pSortableColumn="toLocationId">Location <p-sortIcon field="toLocationId"></p-sortIcon></th>
        <th pSortableColumn="timestamp">Timestamp <p-sortIcon field="timestamp"></p-sortIcon></th>
      </tr>
      <tr>
        <th>
          <input pInputText type="text" (input)="dt.filter(($event.target as HTMLInputElement).value, 'productId', 'contains')" placeholder="Filter" class="w-full" />
        </th>
        <th>
          <input pInputText type="text" (input)="dt.filter(($event.target as HTMLInputElement).value, 'qty', 'contains')" placeholder="Filter" class="w-full" />
        </th>
        <th>
          <input pInputText type="text" (input)="dt.filter(($event.target as HTMLInputElement).value, 'toLocationId', 'contains')" placeholder="Filter" class="w-full" />
        </th>
        <th>
          <input pInputText type="text" (input)="dt.filter(($event.target as HTMLInputElement).value, 'timestamp', 'contains')" placeholder="Filter" class="w-full" />
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-entry>
      <tr>
        <td class="border px-4 py-2">{{ entry.productId }}</td>
        <td class="border px-4 py-2">{{ entry.qty }}</td>
        <td class="border px-4 py-2">{{ entry.toLocationId }}</td>
        <td class="border px-4 py-2">{{ entry.timestamp | date : 'medium' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
